[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shippear-juridico-agent"
version = "0.1.0"
description = "Proyecto de agentes jurídicos con LangChain y patrón supervisor/sub-agentes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
    "tavily-python",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]